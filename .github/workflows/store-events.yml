# .github/workflows/store-events.yml
#
# Scrape local Pokémon shop events into the store_events table every 30
# minutes. Reads THE LIST (scripts/store-events/sources.ts), runs each
# extractor (including the browser-rendered shops — Playwright/Chromium is
# installed below), and replaces each source's rows on success. The IRIS
# /events page reads the table.

name: Scrape store events

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (for the browser-rendered shops)
        run: npx playwright install --with-deps chromium

      - name: Scrape events → Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run scrape-events
